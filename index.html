<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DF Engenharia | Automação e Engenharia</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; background-color: #0d1b2a; color: #fff; }
        .banner { width: 100%; display: block; }
        .logo-container { text-align: center; padding: 20px; background-color: #111d2c; }
        .logo { width: 200px; }
        section { padding: 40px 20px; max-width: 900px; margin: auto; }
        .card { background: #1b263b; padding: 25px; border-radius: 15px; border: 1px solid #00e5ff; }
        footer { text-align: center; padding: 20px; color: #aaa; font-size: 12px; }
    </style>
</head>
<body>
    <img src="banner-df.png" alt="Banner DF" class="banner">
    
    <div class="logo-container">
        <img src="logo-completa.png" alt="DF Engenharia" class="logo">
    </div>

    <section>
        <h1>DF Engenharia</h1>
        <p>Soluções tecnológicas customizadas para automação residencial e industrial.</p>
    </section>

    <section>
        <div class="card">
            <h2>Destaque: DF Auto20</h2>
            <p>Sistema de 20 canais com tecnologia ESP32. Robustez e controle na palma da sua mão.</p>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 DF Engenharia - Diego H. V. Fogari</p>
    </footer>
</body>
</html>
